<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klen Café Inventory System</title>
    <style>
        :root {
            --bg-color: #f7f3eb;
            --primary-color: #6e4e37;
            --secondary-color: #8da47e;
            --accent-color: #d9746b;
            --text-dark: #3e2d20;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 10px 0 30px 0;
            border-bottom: 2px dashed var(--primary-color);
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 2.5rem;
        }

        header p {
            margin: 5px 0 0 0;
            color: #777;
            font-style: italic;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1300px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e1d8cd;
            margin-bottom: 25px;
        }

        .panel h2 {
            margin-top: 0;
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Revenue Ticker Style */
        .revenue-ticker {
            background-color: #faf8f5;
            border: 1px solid var(--secondary-color);
            border-left: 5px solid var(--secondary-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .revenue-ticker span {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        .revenue-amount {
            font-size: 1.3rem !important;
            color: var(--primary-color) !important;
        }

        /* Continuous Display Layout */
        .continuous-menu-container {
            max-height: 800px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .category-section {
            margin-bottom: 25px;
        }

        .category-header {
            color: var(--primary-color);
            font-size: 1.15rem;
            margin: 15px 0 10px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid #ebdccb;
            font-weight: bold;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }

        .menu-item-card {
            background: #faf8f5;
            border: 1px solid #ebdccb;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
            position: relative;
        }

        .menu-item-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .menu-item-header-inline {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .menu-item-info h4 {
            margin: 0 0 5px 0;
            color: var(--text-dark);
        }

        .menu-item-info p {
            margin: 0 0 4px 0;
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: bold;
        }

        .btn-sell {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-sell:hover {
            background-color: #768d67;
        }

        .btn-sell:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn-danger {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Forms and Toolbars */
        .admin-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #555;
        }
        .form-group input, .form-group select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn-action {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .toolbar-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        /* Transaction Log */
        .log-list {
            list-style-type: none;
            padding: 0;
            max-height: 220px;
            overflow-y: auto;
            font-size: 0.9rem;
        }

        .log-list li {
            padding: 8px 10px;
            border-bottom: 1px dashed #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .log-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-timestamp {
            color: #888;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Klen Café</h1>
        <p>Live Sales Tracker (Dataset derived from 1000008333.jpg)</p>
    </header>

    <div class="container">
        
        <div>
            <div class="panel">
                <h2>Data Operations</h2>
                <div class="toolbar-buttons">
                    <button class="btn-action" style="background-color: var(--secondary-color);" onclick="exportInventoryCSV()">📊 Export Stock CSV</button>
                    <button class="btn-action" style="background-color: #555;" onclick="exportSalesCSV()">📋 Export Sales CSV</button>
                    <button class="btn-action" style="background-color: #777;" onclick="clearSavedSession()">🔄 Reset Data</button>
                </div>
            </div>

            <div class="panel">
                <h2>Add New Menu Item</h2>
                <form id="add-item-form" onsubmit="addNewMenuItem(event)">
                    <div class="admin-form">
                        <div class="form-group">
                            <label>Item Name</label>
                            <input type="text" id="new-item-name" placeholder="e.g., Iced Latte" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="new-item-category">
                                <option value="Hot Coffee">ប្រភេទកាហ្វេក្តៅ (HOT)</option>
                                <option value="Ice Coffee">ប្រភេទកាហ្វេត្រជាក់ (ICE)</option>
                                <option value="Matcha">Matcha ម៉ាឆា</option>
                                <option value="Tea">ប្រភេទតែ</option>
                                <option value="Frappe">ប្រភេទក្រឡុក</option>
                                <option value="Soda">ប្រភេទសូដា</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Price (KHR)</label>
                            <input type="number" id="new-item-price" placeholder="4000" required>
                        </div>
                        <div class="form-group">
                            <label>Initial Stock (Cups)</label>
                            <input type="number" id="new-item-stock" placeholder="50" min="0" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-action" style="margin-top: 15px; width: 100%; background-color: var(--secondary-color);">✨ Register Item to Menu</button>
                </form>
            </div>

            <div class="panel">
                <h2>Recent Transactions</h2>
                
                <div class="revenue-ticker">
                    <span>Total Revenue Today:</span>
                    <span id="day-total-revenue" class="revenue-amount">0 KHR</span>
                </div>

                <ul id="transaction-log" class="log-list">
                    <li style="color: #888; justify-content: center;">No sales recorded yet.</li>
                </ul>
            </div>
        </div>

        <div class="panel">
            <h2>Register / Menu Grid</h2>
            
            <div id="continuous-menu" class="continuous-menu-container">
                </div>
        </div>

    </div>

    <script>
        const categoriesMap = {
            "Hot Coffee": "ប្រភេទកាហ្វេក្តៅ (HOT)",
            "Ice Coffee": "ប្រភេទកាហ្វេត្រជាក់ (ICE)",
            "Matcha": "Matcha ម៉ាឆា",
            "Tea": "ប្រភេទតែ",
            "Frappe": "ប្រភេទក្រឡុក",
            "Soda": "ប្រភេទសូដា"
        };

        const defaultMenuItems = [
            // ប្រភេទកាហ្វេក្តៅ (HOT)
            { id: 1, name: "Hot Latte", category: "Hot Coffee", price: 4000, cupsSold: 0, stock: 50 },
            { id: 2, name: "Hot Coffee Milk", category: "Hot Coffee", price: 4000, cupsSold: 0, stock: 50 },
            { id: 3, name: "Hot Cappuccino", category: "Hot Coffee", price: 4000, cupsSold: 0, stock: 50 },
            { id: 4, name: "Hot Mocha", category: "Hot Coffee", price: 4000, cupsSold: 0, stock: 50 },
            { id: 5, name: "Hot Americano", category: "Hot Coffee", price: 4000, cupsSold: 0, stock: 50 },
            { id: 6, name: "Espresso", category: "Hot Coffee", price: 4000, cupsSold: 0, stock: 50 },

            // ប្រភេទកាហ្វេត្រជាក់ (ICE)
            { id: 7, name: "Iced Latte", category: "Ice Coffee", price: 5000, cupsSold: 0, stock: 50 },
            { id: 8, name: "Iced Coffee Milk", category: "Ice Coffee", price: 5000, cupsSold: 0, stock: 50 },
            { id: 9, name: "Iced Americano", category: "Ice Coffee", price: 5000, cupsSold: 0, stock: 50 },
            { id: 10, name: "Iced Mocha", category: "Ice Coffee", price: 5000, cupsSold: 0, stock: 50 },
            { id: 11, name: "Chocolate Milk", category: "Ice Coffee", price: 5000, cupsSold: 0, stock: 50 },
            { id: 12, name: "Vanilla Latte", category: "Ice Coffee", price: 5000, cupsSold: 0, stock: 50 },
            { id: 13, name: "Milk Passion", category: "Ice Coffee", price: 5000, cupsSold: 0, stock: 50 },
            { id: 14, name: "Passion Cream", category: "Ice Coffee", price: 6000, cupsSold: 0, stock: 50 },

            // Matcha ម៉ាឆា
            { id: 15, name: "Matcha Latte", category: "Matcha", price: 5500, cupsSold: 0, stock: 50 },
            { id: 16, name: "Matcha Strawberry", category: "Matcha", price: 7000, cupsSold: 0, stock: 50 },
            { id: 17, name: "Matcha Blueberry", category: "Matcha", price: 7000, cupsSold: 0, stock: 50 },
            { id: 18, name: "Matcha Cream", category: "Matcha", price: 6500, cupsSold: 0, stock: 50 },

            // ប្រភេទតែ
            { id: 19, name: "Lemon Tea", category: "Tea", price: 3500, cupsSold: 0, stock: 50 },
            { id: 20, name: "Honey Lemon Tea", category: "Tea", price: 5000, cupsSold: 0, stock: 50 },
            { id: 21, name: "Milk Green Tea", category: "Tea", price: 5000, cupsSold: 0, stock: 50 },
            { id: 22, name: "Jasmine Milk Tea", category: "Tea", price: 5000, cupsSold: 0, stock: 50 },
            { id: 23, name: "Butterfly Milk Tea", category: "Tea", price: 5000, cupsSold: 0, stock: 50 },
            { id: 24, name: "Hibiscus Tea", category: "Tea", price: 4000, cupsSold: 0, stock: 50 },

            // ប្រភេទក្រឡុក
            { id: 25, name: "Coffee Milk Smoothie", category: "Frappe", price: 7000, cupsSold: 0, stock: 50 },
            { id: 26, name: "Chocolate Smoothie", category: "Frappe", price: 7000, cupsSold: 0, stock: 50 },
            { id: 27, name: "Passion Smoothie", category: "Frappe", price: 7000, cupsSold: 0, stock: 50 },
            { id: 28, name: "Strawberry Smoothie", category: "Frappe", price: 7000, cupsSold: 0, stock: 50 },
            { id: 29, name: "Blueberry Smoothie", category: "Frappe", price: 7000, cupsSold: 0, stock: 50 },

            // ប្រភេទសូដា
            { id: 30, name: "passion soda", category: "Soda", price: 4500, cupsSold: 0, stock: 50 },
            { id: 31, name: "Strawberry Soda", category: "Soda", price: 4500, cupsSold: 0, stock: 50 },
            { id: 32, name: "Blueberry Soda", category: "Soda", price: 4500, cupsSold: 0, stock: 50 },
            { id: 33, name: "Tamarind Soda", category: "Soda", price: 4500, cupsSold: 0, stock: 50 }
        ];

        // Core dynamic arrays initialized fresh from source mapping to clear local storage blocks
        let menuItems = JSON.parse(localStorage.getItem('cafe_revert_menu')) || defaultMenuItems;
        if (menuItems.length < defaultMenuItems.length) {
            menuItems = defaultMenuItems; // Safe update patch to seamlessly pull missing entries
        }
        let salesLog = JSON.parse(localStorage.getItem('cafe_revert_sales')) || [];

        function saveSession() {
            localStorage.setItem('cafe_revert_menu', JSON.stringify(menuItems));
            localStorage.setItem('cafe_revert_sales', JSON.stringify(salesLog));
        }

        function clearSavedSession() {
            if (confirm("Reset application data to original menu defaults? All added items and logs will be cleared.")) {
                localStorage.clear();
                menuItems = defaultMenuItems;
                salesLog = [];
                saveSession();
                initApp();
            }
        }

        function renderContinuousMenu() {
            const container = document.getElementById('continuous-menu');
            container.innerHTML = '';

            const groupedItems = {};
            Object.keys(categoriesMap).forEach(cat => groupedItems[cat] = []);
            
            menuItems.forEach(item => {
                if (groupedItems[item.category]) groupedItems[item.category].push(item);
            });

            Object.keys(categoriesMap).forEach(categoryKey => {
                const itemsInCat = groupedItems[categoryKey];
                if (itemsInCat.length === 0) return;

                let sectionHTML = `
                    <div class="category-section">
                        <div class="category-header">${categoriesMap[categoryKey]}</div>
                        <div class="menu-grid">
                `;

                itemsInCat.forEach(item => {
                    const available = item.stock > 0;
                    sectionHTML += `
                        <div class="menu-item-card" style="opacity: ${available ? 1 : 0.6}">
                            <div class="menu-item-header-inline">
                                <div class="menu-item-info">
                                    <h4>${item.name}</h4>
                                    <p>${item.price.toLocaleString()} KHR</p>
                                    <small style="color:#777;">Stock Remaining: ${item.stock}</small>
                                </div>
                                <button class="btn-danger" onclick="removeMenuItem(${item.id})">✕</button>
                            </div>
                            <button class="btn-sell" ${available ? '' : 'disabled'} onclick="sellItem(${item.id})">
                                ${available ? 'Record Sale' : 'Insufficient Stock'}
                            </button>
                        </div>
                    `;
                });

                sectionHTML += `</div></div>`;
                container.innerHTML += sectionHTML;
            });
        }

        function sellItem(itemId) {
            const item = menuItems.find(i => i.id === itemId);
            if (!item || item.stock <= 0) return;

            item.stock -= 1;
            item.cupsSold += 1;

            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            salesLog.unshift({ id: Date.now(), itemId: item.id, time, name: item.name, price: item.price });
            
            saveSession();
            initApp();
        }

        function removeTransaction(logId) {
            const logIndex = salesLog.findIndex(log => log.id === logId);
            if (logIndex === -1) return;

            const transaction = salesLog[logIndex];
            const item = menuItems.find(i => i.id === transaction.itemId || i.name === transaction.name);
            if (item) {
                item.stock += 1;
                if (item.cupsSold > 0) item.cupsSold -= 1;
            }

            salesLog.splice(logIndex, 1);
            saveSession();
            initApp();
        }

        function renderSalesLogHTML() {
            const logList = document.getElementById('transaction-log');
            const totalRevenueContainer = document.getElementById('day-total-revenue');
            
            const dailyTotal = salesLog.reduce((sum, entry) => sum + entry.price, 0);
            totalRevenueContainer.innerText = `${dailyTotal.toLocaleString()} KHR`;

            if (salesLog.length === 0) {
                logList.innerHTML = '<li style="color: #888; justify-content: center;">No sales recorded yet.</li>';
                return;
            }
            logList.innerHTML = '';
            salesLog.forEach(log => {
                logList.innerHTML += `
                    <li>
                        <div class="log-details">
                            <span><strong>${log.name}</strong> sold</span>
                            <span class="log-timestamp">${log.time}</span>
                        </div>
                        <div class="log-meta">
                            <span style="color: var(--primary-color); font-weight: bold;">+${log.price.toLocaleString()} KHR</span>
                            <button class="btn-danger" style="padding: 2px 6px; font-size: 0.75rem;" onclick="removeTransaction(${log.id})" title="Remove Transaction">✕</button>
                        </div>
                    </li>
                `;
            });
        }

        function addNewMenuItem(e) {
            e.preventDefault();
            const name = document.getElementById('new-item-name').value;
            const category = document.getElementById('new-item-category').value;
            const price = parseFloat(document.getElementById('new-item-price').value);
            const stock = parseInt(document.getElementById('new-item-stock').value) || 0;

            menuItems.push({ id: Date.now(), name, category, price, cupsSold: 0, stock });
            saveSession();
            document.getElementById('add-item-form').reset();
            initApp();
        }

        function removeMenuItem(id) {
            if (confirm("Delete this menu option permanently?")) {
                menuItems = menuItems.filter(item => item.id !== id);
                saveSession();
                initApp();
            }
        }

        function downloadCSV(csvContent, fileName) {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportInventoryCSV() {
            let csv = "Drink Option Name,Category,Total Cups Sold,Stock Remaining\r\n";
            menuItems.forEach(i => {
                csv += `"${i.name}","${i.category}","${i.cupsSold}","${i.stock}"\r\n`;
            });
            downloadCSV(csv, "Cafe_Cup_Inventory_Report.csv");
        }

        function exportSalesCSV() {
            let csv = "Timestamp,Item Sold,Revenue Gathered (KHR)\r\n";
            salesLog.forEach(l => { csv += `"${l.time}","${l.name}","${l.price}"\r\n`; });
            downloadCSV(csv, "Register_Sales_Log.csv");
        }

        function initApp() {
            renderContinuousMenu();
            renderSalesLogHTML();
        }

        initApp();
    </script>
</body>
</html>
